name: Build and release

# Every push to main builds the add-on and publishes a GitHub Release tagged vN (N = highest vN tag + 1).
# A push whose last commit has "(Skip)" in its first line (any letter case) does not build or release.
# Only the first line counts, so a message body that mentions (Skip) does not skip the release.
# Nothing is ever built without being released.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Releases run one at a time so two runs never pick the same release number.
  group: release
  cancel-in-progress: false

jobs:
  check-skip:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - id: skip
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first_line="${MESSAGE%%$'\n'*}"
          shopt -s nocasematch
          if [[ "$first_line" == *"(skip)"* ]]; then skip=true; else skip=false; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "First line: $first_line"
          echo "Skip build and release: $skip"

  build:
    needs: check-skip
    if: ${{ needs.check-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out version and changelog
        id: info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog starts at the last release that still exists, not at the last tag,
          # so deleted releases are folded into this one.
          $released = @(gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $info = & tools/release/Get-ReleaseInfo.ps1 -NotesFile changelog.md -ReleasedTags $released
          Write-Host "Changelog since $(if ($info.LastTag) { $info.LastTag } else { 'the first commit' })"
          "tag=$($info.Tag)" >> $env:GITHUB_OUTPUT
          "title=$($info.Title)" >> $env:GITHUB_OUTPUT
          "file_version=$($info.FileVersion)" >> $env:GITHUB_OUTPUT
          "asset_suffix=$($info.AssetSuffix)" >> $env:GITHUB_OUTPUT
          Write-Host "Release $($info.Tag), version $($info.FileVersion), ZIP suffix $($info.AssetSuffix)"
          Get-Content changelog.md
          "### Publishing release $($info.Tag)" >> $env:GITHUB_STEP_SUMMARY

      - name: Build and package
        shell: cmd
        env:
          RESHADE_VR_UI_VERSION: ${{ steps.info.outputs.file_version }}
          RESHADE_VR_UI_RELEASE_SUFFIX: ${{ steps.info.outputs.asset_suffix }}
        run: call build.bat

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $zips = Get-ChildItem -LiteralPath build/reshade-openxr-ui-release -Filter 'ReShade-VR-UI-Addon-*.zip' -File
          if ($zips.Count -ne 1) { throw "Expected 1 ZIP, found $($zips.Count): $($zips.Name -join ', ')" }
          $ini = Get-Item -LiteralPath build/reshade-openxr-ui-release/ReShadeVR.ini
          # Same "<hash>  <file name>" format as sha256sum, so it can be checked on any system.
          $lines = Get-FileHash -LiteralPath (@($zips.FullName) + $ini.FullName) -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllText("$PWD/build/reshade-openxr-ui-release/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          $lines

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.info.outputs.file_version }}
          path: |
            build/reshade-openxr-ui-release/*.zip
            build/reshade-openxr-ui-release/ReShadeVR.ini
            build/reshade-openxr-ui-release/SHA256SUMS.txt
            build/steamvr-listener-release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & tools/release/New-ReleaseNotes.ps1 -OutFile release-notes.md -ChangelogFile changelog.md `
            -ChecksumsFile build/reshade-openxr-ui-release/SHA256SUMS.txt `
            -Tag '${{ steps.info.outputs.tag }}' -AssetSuffix '${{ steps.info.outputs.asset_suffix }}' `
            -Repository '${{ github.repository }}'
          $zips = @((Get-ChildItem -LiteralPath build/reshade-openxr-ui-release -Filter 'ReShade-VR-UI-Addon-*.zip' -File).FullName)
          gh release create '${{ steps.info.outputs.tag }}' `
            --target '${{ github.sha }}' `
            --title '${{ steps.info.outputs.title }}' `
            --notes-file release-notes.md `
            @zips `
            build/reshade-openxr-ui-release/ReShadeVR.ini `
            build/reshade-openxr-ui-release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
